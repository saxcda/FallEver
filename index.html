<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>GRE 1500</title>
<style>
:root{--bg:#0b1020;--panel:#131b30;--panel2:#1a2540;--line:#2a3655;--text:#f6f8fc;--muted:#9da9c0;--blue:#7c9cff;--green:#5fda9a;--red:#ff7f8d}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","SF Pro Display",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:27px}.sub,.muted{color:var(--muted)}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.badge{background:var(--panel);border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;color:var(--green)}
.card,.listbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:12px 0}.card{padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0}
.stat{background:var(--panel2);border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
button,select{font:inherit}button{border:0;border-radius:13px;padding:12px 14px;font-weight:750;background:var(--blue);color:#fff;touch-action:manipulation}.secondary{background:var(--panel2);border:1px solid var(--line)}
.controls{display:flex;gap:8px;flex-wrap:wrap}select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:11px}
.preview{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.worditem{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px}.worditem strong{display:block}.worditem span{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:4px}
.hidden{display:none!important}.wordgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 12px 12px}.listbox summary{padding:14px 15px;cursor:pointer;display:flex;justify-content:space-between}.listbox summary span{color:var(--muted);font-size:12px}
.qtop{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.qword{font-size:42px;font-weight:850;margin:22px 0 18px;word-break:break-word}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text)}.choice.correct{border-color:var(--green);background:rgba(95,218,154,.12)}.choice.wrong{border-color:var(--red);background:rgba(255,127,141,.12)}
.feedback{min-height:24px;margin-top:12px}.good{color:var(--green)}.bad{color:var(--red)}.memory{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;color:var(--muted);font-size:12px;line-height:1.5}.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.reviewrow{padding:12px 0;border-bottom:1px solid var(--line)}.reviewrow div{margin-top:3px}.reviewrow small{display:block;color:var(--muted);margin-top:4px}.due{color:#ffd166}.empty,.error{padding:14px;color:var(--muted)}.error{color:#ffd6dc;border:1px solid var(--red);border-radius:13px}
nav{position:fixed;z-index:9999;left:0;right:0;bottom:0;background:rgba(11,16,32,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}
nav button{background:transparent;color:var(--muted);padding:10px 14px;min-width:67px}nav button.active{background:var(--panel2);color:var(--text)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.wordgrid,.preview{grid-template-columns:1fr}.qword{font-size:36px}nav button{padding:10px 8px;min-width:60px;font-size:13px}}
</style>
</head>
<body>
<main>
  <div class="header">
    <div><h1>GRE 1500</h1><div class="sub">30 Lists · 中文四選一 · 遺忘曲線複習</div></div>
    <div class="badge" id="load-status">載入中…</div>
  </div>

  <section id="home">
    <div class="card">
      <strong>學習進度</strong>
      <div class="stats">
        <div class="stat"><b id="stat-learned">0</b><span>已學</span></div>
        <div class="stat"><b id="stat-acc">—</b><span>正確率</span></div>
        <div class="stat"><b id="stat-due">0</b><span>待複習</span></div>
        <div class="stat"><b id="stat-pos">1 / 1500</b><span>目前題號</span></div>
      </div>
      <div class="controls">
        <button id="continue-btn" type="button">繼續 Quiz</button>
        <button id="due-btn" class="secondary" type="button">到期複習</button>
        <select id="jump-list"><option value="0">跳到 List…</option></select>
      </div>
      <p class="muted" style="font-size:12px;line-height:1.55;margin-bottom:0">答對：10 分鐘 → 1 天 → 3 天 → 7 天 → 14 天 → 30 天 → 60 天；答錯：5 分鐘後再出現。</p>
    </div>

    <div class="card">
      <strong>單字預覽｜List 1</strong>
      <div class="preview" style="margin-top:10px">
        <div class="worditem"><strong>minute</strong><span>極小的</span></div>
        <div class="worditem"><strong>bitter</strong><span>言辭激烈的，尖酸刻薄的</span></div>
        <div class="worditem"><strong>humble</strong><span>地位低下的，卑微的</span></div>
        <div class="worditem"><strong>modest</strong><span>適度的，有限的</span></div>
      </div>
    </div>
  </section>

  <section id="words" class="hidden">
    <div class="card">
      <div class="controls" style="justify-content:space-between;align-items:center">
        <div><strong>1500 單字總覽</strong><div class="sub">30 Lists × 50 字</div></div>
        <select id="words-list"><option value="0">全部 Lists</option></select>
      </div>
    </div>
    <div id="words-wrap"></div>
  </section>

  <section id="quiz" class="hidden">
    <div class="card" id="quiz-card">
      <div class="qtop"><span id="q-progress"></span><span id="q-list"></span></div>
      <div class="qword" id="q-word"></div>
      <div class="choices" id="q-choices"></div>
      <div class="feedback" id="q-feedback"></div>
      <div class="memory" id="q-memory"></div>
      <div class="qnav">
        <button id="prev-btn" class="secondary" type="button">← 上一題</button>
        <button id="next-btn" type="button">下一題 →</button>
      </div>
    </div>
  </section>

  <section id="review" class="hidden">
    <div class="card">
      <div class="controls" style="justify-content:space-between;align-items:center">
        <div><strong>Review</strong><div class="sub">依到期時間排序</div></div>
        <button id="review-due-btn" class="secondary" type="button">開始到期複習</button>
      </div>
      <div id="review-wrap"></div>
    </div>
  </section>
</main>

<nav>
  <button id="nav-home" class="active" type="button" data-page="home">首頁</button>
  <button id="nav-words" type="button" data-page="words">單字</button>
  <button id="nav-quiz" type="button" data-page="quiz">Quiz</button>
  <button id="nav-review" type="button" data-page="review">Review</button>
</nav>

<script src="data.js?v=20260929-4"></script>
<script>
(function () {
  "use strict";

  var DATA = window.GRE_DATA || [];
  var KEY = "gre1500_memory_v3";
  var INTERVALS = [600000, 86400000, 259200000, 604800000, 1209600000, 2592000000, 5184000000];
  var LABELS = ["10 分鐘", "1 天", "3 天", "7 天", "14 天", "30 天", "60 天"];

  var state = { last: 0, answers: 0, correct: 0, cards: {} };
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) state = Object.assign(state, JSON.parse(saved));
  } catch (e) {}

  var currentIndex = Math.max(0, Math.min(1499, Number(state.last || 0)));
  var reviewQueue = [];
  var reviewPos = 0;
  var reviewMode = false;

  function $(id) { return document.getElementById(id); }
  function save() {
    state.last = currentIndex;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    updateStats();
  }
  function getCard(i) {
    if (!state.cards[i]) {
      state.cards[i] = { seen: 0, correct: 0, wrong: 0, stage: -1, next: 0 };
    }
    return state.cards[i];
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function formatTime(ts) {
    if (!ts) return "尚未排程";
    var d = ts - Date.now();
    if (d <= 0) return "現在到期";
    if (d < 3600000) return Math.ceil(d / 60000) + " 分鐘後";
    if (d < 86400000) return Math.ceil(d / 3600000) + " 小時後";
    return new Date(ts).toLocaleString("zh-TW", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
  }
  function showPage(name) {
    ["home","words","quiz","review"].forEach(function (p) {
      $(p).classList.toggle("hidden", p !== name);
      $("nav-" + p).classList.toggle("active", p === name);
    });
    if (name === "words") renderWords();
    if (name === "quiz") renderQuestion();
    if (name === "review") renderReview();
    if (name === "home") updateStats();
    window.scrollTo(0, 0);
  }
  function updateStats() {
    var cards = Object.keys(state.cards).map(function (k) { return state.cards[k]; });
    var learned = cards.filter(function (c) { return c.seen > 0; }).length;
    var due = cards.filter(function (c) { return c.next && c.next <= Date.now(); }).length;
    $("stat-learned").textContent = learned;
    $("stat-due").textContent = due;
    $("stat-pos").textContent = (currentIndex + 1) + " / 1500";
    $("stat-acc").textContent = state.answers ? Math.round(state.correct / state.answers * 100) + "%" : "—";
    $("load-status").textContent = DATA.length === 1500 ? "✓ 已載入 1500 個單字" : "⚠ 題庫載入異常：" + DATA.length + " / 1500";
  }
  function populateSelectors() {
    var a = $("jump-list");
    var b = $("words-list");
    for (var i = 1; i <= 30; i++) {
      var o1 = document.createElement("option");
      o1.value = i; o1.textContent = "List " + i;
      a.appendChild(o1);
      var o2 = document.createElement("option");
      o2.value = i; o2.textContent = "List " + i;
      b.appendChild(o2);
    }
  }
  function renderWords() {
    if (DATA.length !== 1500) {
      $("words-wrap").innerHTML = '<div class="error">題庫沒有完整載入，請重新整理頁面。</div>';
      return;
    }
    var chosen = Number($("words-list").value || 0);
    var html = "";
    for (var list = 1; list <= 30; list++) {
      if (chosen && chosen !== list) continue;
      var rows = DATA.filter(function (x) { return x[2] === list; });
      html += '<details class="listbox"' + ((chosen || list === 1) ? " open" : "") + '>';
      html += '<summary><strong>List ' + list + '</strong><span>' + rows.length + ' words</span></summary>';
      html += '<div class="wordgrid">';
      rows.forEach(function (x, j) {
        html += '<div class="worditem"><strong>' + escapeHtml(x[0]) + '</strong><span>#' + (j+1) + ' · ' + escapeHtml(x[1]) + '</span></div>';
      });
      html += "</div></details>";
    }
    $("words-wrap").innerHTML = html;
  }
  function choiceSet(index) {
    var item = DATA[index];
    if (!item) return [];
    var meaning = item[1], list = item[2];
    var pool = DATA.filter(function (x, j) {
      return j !== index && x[2] === list && x[1] !== meaning;
    }).map(function (x) { return x[1]; });
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    var arr = [meaning].concat(pool.slice(0, 3));
    for (var a = arr.length - 1; a > 0; a--) {
      var b = Math.floor(Math.random() * (a + 1));
      var t2 = arr[a]; arr[a] = arr[b]; arr[b] = t2;
    }
    return arr;
  }
  function renderQuestion() {
    if (DATA.length !== 1500) {
      $("quiz-card").innerHTML = '<div class="error">題庫沒有完整載入，請重新整理頁面。</div>';
      return;
    }
    if (reviewMode && reviewQueue.length) currentIndex = reviewQueue[reviewPos];
    var item = DATA[currentIndex];
    var card = getCard(currentIndex);
    $("q-progress").textContent = "題目 " + (currentIndex + 1) + " / 1500";
    $("q-list").textContent = "List " + item[2] + " · #" + ((currentIndex % 50) + 1);
    $("q-word").textContent = item[0];
    $("q-feedback").textContent = "";
    $("q-feedback").className = "feedback";
    var choices = $("q-choices");
    choices.innerHTML = "";
    choiceSet(currentIndex).forEach(function (meaning) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.textContent = meaning;
      btn.addEventListener("click", function () {
        gradeAnswer(btn, meaning === item[1], item[1]);
      });
      choices.appendChild(btn);
    });
    $("q-memory").textContent = "記憶階段：" + (card.stage < 0 ? "新字／重學" : LABELS[card.stage]) +
      " ｜ 下一次：" + formatTime(card.next) +
      " ｜ ✓ " + card.correct + " / ✕ " + card.wrong;
    save();
  }
  function gradeAnswer(button, ok, correctMeaning) {
    var buttons = Array.prototype.slice.call(document.querySelectorAll("#q-choices .choice"));
    buttons.forEach(function (b) { b.disabled = true; });
    var card = getCard(currentIndex);
    state.answers += 1;
    card.seen += 1;

    if (ok) {
      state.correct += 1;
      card.correct += 1;
      card.stage = Math.min(card.stage + 1, INTERVALS.length - 1);
      card.next = Date.now() + INTERVALS[Math.max(0, card.stage)];
      button.classList.add("correct");
      $("q-feedback").textContent = "答對 ✓";
      $("q-feedback").className = "feedback good";
    } else {
      card.wrong += 1;
      card.stage = -1;
      card.next = Date.now() + 300000;
      button.classList.add("wrong");
      buttons.forEach(function (b) {
        if (b.textContent === correctMeaning) b.classList.add("correct");
      });
      $("q-feedback").textContent = "答錯。正確答案：" + correctMeaning;
      $("q-feedback").className = "feedback bad";
    }
    $("q-memory").textContent = "下一次：" + formatTime(card.next) + " ｜ ✓ " + card.correct + " / ✕ " + card.wrong;
    save();
  }
  function nextQuestion() {
    if (reviewMode && reviewQueue.length) {
      reviewPos += 1;
      if (reviewPos >= reviewQueue.length) {
        reviewMode = false;
        reviewQueue = [];
        showPage("review");
        return;
      }
      currentIndex = reviewQueue[reviewPos];
    } else {
      currentIndex = Math.min(1499, currentIndex + 1);
    }
    renderQuestion();
  }
  function prevQuestion() {
    if (reviewMode && reviewQueue.length) {
      reviewPos = Math.max(0, reviewPos - 1);
      currentIndex = reviewQueue[reviewPos];
    } else {
      currentIndex = Math.max(0, currentIndex - 1);
    }
    renderQuestion();
  }
  function startDueReview() {
    reviewQueue = DATA.map(function (_, i) { return i; }).filter(function (i) {
      var c = state.cards[i];
      return c && c.next && c.next <= Date.now();
    });
    if (!reviewQueue.length) {
      alert("目前沒有到期單字");
      return;
    }
    reviewMode = true;
    reviewPos = 0;
    currentIndex = reviewQueue[0];
    showPage("quiz");
  }
  function renderReview() {
    var rows = DATA.map(function (x, i) {
      return {data:x, index:i, card:state.cards[i]};
    }).filter(function (o) {
      return o.card && o.card.seen > 0;
    }).sort(function (a, b) {
      return (a.card.next || 9999999999999) - (b.card.next || 9999999999999);
    });

    if (!rows.length) {
      $("review-wrap").innerHTML = '<div class="empty">你還沒有作答紀錄。</div>';
      return;
    }
    var html = "";
    rows.forEach(function (o) {
      var due = o.card.next && o.card.next <= Date.now();
      html += '<div class="reviewrow"><strong>' + escapeHtml(o.data[0]) + '</strong>';
      html += '<div>' + escapeHtml(o.data[1]) + '</div>';
      html += '<small>List ' + o.data[2] + ' · ' + (due ? '<span class="due">現在到期</span>' : formatTime(o.card.next)) +
        ' · ✓ ' + o.card.correct + ' / ✕ ' + o.card.wrong + '</small></div>';
    });
    $("review-wrap").innerHTML = html;
  }

  document.querySelectorAll("[data-page]").forEach(function (btn) {
    btn.addEventListener("click", function () { showPage(btn.getAttribute("data-page")); });
  });
  $("continue-btn").addEventListener("click", function () { showPage("quiz"); });
  $("due-btn").addEventListener("click", startDueReview);
  $("review-due-btn").addEventListener("click", startDueReview);
  $("next-btn").addEventListener("click", nextQuestion);
  $("prev-btn").addEventListener("click", prevQuestion);
  $("jump-list").addEventListener("change", function () {
    var n = Number(this.value || 0);
    if (n) {
      reviewMode = false;
      currentIndex = (n - 1) * 50;
      showPage("quiz");
    }
  });
  $("words-list").addEventListener("change", renderWords);

  populateSelectors();
  updateStats();
})();
</script>
</body>
</html>
